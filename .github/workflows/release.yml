name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and test
        run: |
          npm run build
          npm test

      - name: Compute and apply the next CalVer version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(python3 -m scripts.set_version --next-from-tags)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit the version bump and the rebuilt bundle
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json template-entity-row.js
          # package.json/the built bundle may already read as today's next
          # version (e.g. a manual local bump ahead of the first release run
          # for the day) - nothing to commit is not a failure, the tag/
          # release step below still needs to run.
          git diff --staged --quiet && echo "already at v${{ steps.version.outputs.version }}, nothing to commit" || git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git push origin HEAD:master

      - name: Tag and create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          git push origin "$TAG"
          # template-entity-row.js is already committed to the tree (HACS can
          # install directly from the tagged tree here) - the release asset
          # is a convenience copy, not strictly required the way it is for
          # decluttering-card.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes template-entity-row.js
