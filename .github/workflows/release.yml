name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (semver, no "v" prefix, e.g. 1.5.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check the tag doesn't already exist
        run: |
          if git rev-parse "v${{ github.event.inputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ github.event.inputs.version }} already exists." >&2
            exit 1
          fi
      - name: Set package.json version
        run: npm version "${{ github.event.inputs.version }}" --no-git-tag-version --allow-same-version
      - name: Commit the version bump and the rebuilt bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json template-entity-row.js
          git commit -m "chore(release): v${{ github.event.inputs.version }}"
          git tag "v${{ github.event.inputs.version }}"
          git push origin master
          git push origin "v${{ github.event.inputs.version }}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version }}"
          name: "v${{ github.event.inputs.version }}"
          body: See CHANGELOG.md for details.
          files: template-entity-row.js
